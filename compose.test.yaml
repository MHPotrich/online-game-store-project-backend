services:
  data-base:
    image: postgres:18.4-alpine
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: online-game-store-db
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d online-game-store-db"]
      interval: 5s
      timeout: 5s
      retries: 5

  online-game-store-backend:
    build:
      context: .
      dockerfile: dockerfile.test
    container_name: online-game-store-backend
    depends_on:
      data-base:
        condition: service_healthy
    ports:
      - 8080:8080
    environment:
      DB_URL: ${DB_USER}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
